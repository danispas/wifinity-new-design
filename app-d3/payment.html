<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" href="../favicon.ico" />
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="sign-in.css" />

    <title>Wifinity - Review Subscription</title>

    <script src="toggle-esim.js" defer></script>
    <script
      type="text/javascript"
      src="https://widget.trustpilot.com/bootstrap/v5/tp.widget.bootstrap.min.js"
      async>
    </script>
  </head>

  <body class="w-light-theme">
    <header class="w-header">
      <div class="w-header__container">
        <a href="../index.html">
          <img
            src="../img/wifinity_logo_white.svg"
            alt="Wifinity"
            class="w-logo"
          />
        </a>
      </div>

      <div class="w-header__menu">
        <div class="w-header__menu-item">
          Need Help?
        </div>

        <!-- <div class="w-header__menu-icon-button">
          <a href="./sign-in.html" class="w-header__menu-item-ahref"></a>
          <img
            src="../img/person_icon.svg"
            class="w-header__menu-icon-button__icon"
          />
        </div> -->
      </div>
    </header>
    
    <main class="w-main">
      <nav class="w-stepper">
        <a
          href="#"
          class="w-stepper__item w-stepper__item--done"
        >
          <span class="w-stepper__number">✓</span>
          <span class="w-stepper__label">Account</span>
        </a>
  
        <div class="w-stepper__line"></div>
  
        <a
          href="#"
          class="w-stepper__item w-stepper__item--done"
        >
          <span class="w-stepper__number">✓</span>
          <span class="w-stepper__label">Review Plan</span>
        </a>
  
        <div class="w-stepper__line"></div>
  
        <a
          href="#"
          class="w-stepper__item w-stepper__item--active"
        >
          <span class="w-stepper__number">3</span>
          <span class="w-stepper__label">Checkout</span>
        </a>
      </nav>

      <section class="w-connection mb-2">
        <h1 class="w-connection__title">
          Checkout
        </h1>

        <div class="w-create-account__cards">
          <div class="w-create-account__stripe-container">
            <div class="w-order-summary mb-2">
              <!-- <div class="w-connection-summary__session">
                <div>Order summary</div>
              </div> -->
  
              <div class="w-create-account__summary-details">
                <img src="../img/stripe-checkout.PNG" alt="Stripe Checkout" class="w-order-summary__checkout-image" />
              </div>
            </div>

            <div class="w-create-account__cta-container">
              <div class="w-create-account__cta">
                <a href="dashboard.html" class="w-connection-card__ahref"></a>
                <div>Continue</div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="w-footer">
      <div class="w-footer__container">
        <div class="w-footer__info">
          <div class="w-footer__info-block">
            <img src="../img/wifinity_icon.png" class="w-footer__wifinity-icon">
            <div class="w-footer__info-block__description">
              Connecting the Armed Forces since 2007
            </div>
          </div>

          <div class="w-footer__info-block">
            <div class="w-footer__info-block__title">Support</div>
            <a href="#" class="w-footer__info-block__link">+44 (0) 20 8090 1290</a>
            <a href="#" class="w-footer__info-block__link">support@wifinity.co.uk</a>
          </div>

          <div class="w-footer__info-block">
            <div class="w-footer__info-block__title">Legal</div>
            <a href="#" class="w-footer__info-block__link">Terms & Conditions</a>
            <a href="#" class="w-footer__info-block__link">Privacy Policy</a>
            <a href="#" class="w-footer__info-block__link">Refund Policy</a>
          </div>
        </div>

        <p class="w-footer__copyright">©2026 Wifinity. All rights reserved.</p>
      </div>
    </footer>
  </body>
</html>
