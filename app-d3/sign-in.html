<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" href="../favicon.ico" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="sign-in.css" />

    <title>Wifinity - Sign In</title>

    <script
      type="text/javascript"
      src="https://widget.trustpilot.com/bootstrap/v5/tp.widget.bootstrap.min.js"
      async>
    </script>
  </head>

  <body class="w-light-theme">
    <header class="w-header">
      <div class="w-header__container">
        <a href="../index.html">
          <img
            src="../img/wifinity_logo_white.svg"
            alt="Wifinity"
            class="w-logo"
          />
        </a>
  
        <div class="w-header__menu">
          <div class="w-header__menu-item">
            <a href="./select-plan.html" class="w-header__menu-item-ahref"></a>
            Internet
          </div>
          <div class="w-header__menu-item">eSIM</div>
          <div class="w-header__menu-item">About</div>
        </div>
      </div>

      <div class="w-header__menu">
        <div class="w-header__menu-item">
          Need Help?
        </div>
        <div class="w-header__cta">Check Availability</div>
      </div>
    </header>

    <div class="w-login-container">
      <div class="w-login-content">
        <div class="w-login-content__form">
          <div class="w-login-content__note">
            <p>Welcome back!</p>
            <p><b>Sign in</b> to manage your account.</p>
          </div>

          <div class="w-login-content__field">
            <input
              class="w-login-content__input-field"
              type="email"
              placeholder="E-mail"
            />
          </div>

          <div class="w-login-content__field">
            <input
              class="w-login-content__input-field w-login-content__input-field--password"
              type="password"
              placeholder="Password"
            />

            <button
              type="button"
              class="w-login-content__password-toggle"
              aria-label="Show password"
            >
              <!-- Eye icon -->
              <svg
                width="22"
                height="22"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path d="M1 12S5 5 12 5s11 7 11 7-4 7-11 7S1 12 1 12Z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            </button>
          </div>

          <div class="w-login-content__actions">
            <a href="#" class="w-login-content__forgot-password">
              Forgot Password?
            </a>
          </div>

          <button class="w-login-content__submit-button">
            <a href="./dashboard.html" class="w-header__menu-item-ahref"></a>
            Sign In
          </button>

          <div class="w-login-content__info">Don't have an account? <a href="./sign-up.html" class="w-login-content__info-link">Sign Up</a></div>
        </div>
      </div>

      <div class="w-login-illustration">
        <div
          ref="trustbox"
          class="trustpilot-widget"
          data-locale="en-US"
          data-template-id="53aa8807dec7e10d38f59f32"
          data-businessunit-id="57b60ae20000ff000593a426"
          data-style-height="125px"
          data-style-width="100%"
          data-theme="dark"
        >
          <a
            href="https://www.trustpilot.com/review/wifinity.co.uk"
            target="_blank"
            rel="noopener"
          >Trustpilot</a>
        </div>

        <div class="w-login-illustration-note">
          <p>
            Our customers love our reliable service and easy-to-use platform.
            See what they have to say on Trustpilot!
          </p>
        </div>
      </div>
    </div>
  </body>
</html>
