<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" href="favicon.ico" />
    <link rel="stylesheet" href="styles-bundle.css">
    <link rel="stylesheet" href="purchase-internet-v2.css">

    <title>Wifinity</title>

    <script src="purchase-internet-v2.js" defer></script>
    <script
      type="text/javascript"
      src="https://widget.trustpilot.com/bootstrap/v5/tp.widget.bootstrap.min.js"
      async>
    </script>
  </head>

  <body class="w-light-theme">
    <header>
      <div class="w-header">
        <div class="w-logo-container">
          <img src="img/wifinity_logo_black.png" alt="Wifinity Logo" class="w-logo">
        </div>
      </div>
    </header>

    <main>
      <div class="w-background-white h-100">
        <div class="w-container">
          <div class="w-plan-selector">
            <div>
              <div class="w-plan-tabs">
                <button
                  class="w-plan-tabs__tab w-plan-tabs__tab--active"
                  data-tab="monthly"
                >
                  Monthly plans
                </button>
  
                <button
                  class="w-plan-tabs__tab"
                  data-tab="passes"
                >
                  Short-term passes
                </button>
              </div>
  
              <div class="w-plan-tabs__content">
                <div
                  class="w-plan-tabs__panel w-plan-tabs__panel--active"
                  id="monthly"
                >
                  <div class="w-plan-selector__monthly-plans"></div>
                </div>
  
                <div
                  class="w-plan-tabs__panel"
                  id="passes"
                >
                  <div class="w-plan-selector__passes-plans"></div>
                </div>
              </div>
            </div>

            <div class="w-plan-summary-container">
              <div class="w-plan-summary__session">
                <div>Order summary</div>
                <div>Session <b>expires in 30 minutes</b></div>
              </div>

              <div class="w-plan-summary">
                <div class="w-plan-summary__header">
                  <div id="planName" class="w-plan-summary__plane-name">
                    Basic
                  </div>

                  <span
                    id="totalPriceMobile"
                    class="w-plan-summary__header-price"
                  >
                    £24.99
                  </span>
                </div>
  
                <div class="w-plan-details">
                  <div class="w-plan-details__row">
                    <div class="w-plan-details__row-header">
                      <img
                        id="planSpeedIcon"
                        src="img/speed_basic_icon.svg"
                        alt="Speed Icon"
                        class="w-plan-details__icon"
                      >
                      <span>Speed</span>
                    </div>
    
                    <span class="w-plan-details__plan-metadata">
                      Up to
                      <span id="planSpeed">
                        30 mb/s
                      </span>
                    </span>
                  </div>
  
                  <div class="w-plan-details__row">
                    <div class="w-plan-details__row-header">
                      <img
                        id="planDevicesIcon"
                        src="img/devices_icon.svg"
                        alt="Devices Icon"
                        class="w-plan-details__icon"
                      >
                      <span>Devices</span>
                    </div>
  
                    <span
                      id="planDevices"
                      class="w-plan-details__plan-metadata"
                    >
                      2 Devices
                    </span>
                  </div>

                  <div class="w-plan-details__row">
                    <div class="w-plan-details__row-header">
                      <img
                        id="planDataIcon"
                        src="img/swap_vert_icon.svg"
                        alt="Data Icon"
                        class="w-plan-details__icon"
                      >
                      <span>Data</span>
                    </div>
  
                    <span
                      id="planData"
                      class="w-plan-details__plan-metadata"
                    >
                      Unlimited
                    </span>
                  </div>
                </div>
  
                <div class="w-plan-price">
                  <div class="w-plan-price__row w-plan-price__row--total">
                    <span>Total Price</span>
                    <div>
                      <span id="totalPrice">£24.99</span>
                    </div>
                  </div>
                </div>
  
                <a href="purchase-internet-add-esim-v2.html">
                  <button class="w-plan-summary__button">
                    Get connected
                  </button>
                </a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer>
      <div class="w-footer-container">
        <div>
          <span class="w-footer__contact">Tel: +44 (0) 20 8090 1290</span>
          <span class="w-footer__contact">Email: support@wifinity.co.uk</span>
        </div>
        <p>©2026 Wifinity</p>
      </div>
    </footer>
  </body>
</html>
